[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "releasarr-backend"
version = "0.11.0"
description = "Releasarr API and scheduler"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Releasarr Team" }]
dependencies = [
    "fastapi[standard]>=0.115.8",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.0",
    # 2.0.46 re-daemonizes aiosqlite 0.22's worker thread; older releases hang at exit.
    "sqlalchemy[asyncio]>=2.0.46",
    "alembic>=1.14.1",
    "httpx>=0.28.1",
    "asyncpg>=0.30.0",
    "python-json-logger>=2.0.7",
    "aiosqlite>=0.21.0",
    "loguru>=0.7.3",
    "torrentool>=1.1.0",
    "pyjwt>=2.9.0",
    "pwdlib[argon2]>=0.2.1",
]

[dependency-groups]
test = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]
typecheck = [
    "mypy>=1.13.0",
]
lint = [
    "ruff>=0.9.7",
]
format = [
    "black>=24.10.0",
]

dev = [
    "ipython>=8.28.0",
]

[tool.uv]
default-groups = ["lint", "typecheck", "test"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
dynamic = []

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
implicit_reexport = false
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["torrentool.*", "yaml"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ASYNC", "PIE", "RUF"]

[tool.black]
line-length = 100
preview = true
