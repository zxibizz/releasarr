<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Releasarr">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
    <!--
      User space, not the default objectBoundingBox: the arrow's shaft and the
      tray are single-axis lines, so their bounding box has one zero dimension
      and an objectBoundingBox gradient makes them vanish.
    -->
    <linearGradient
      id="glyph"
      gradientUnits="userSpaceOnUse"
      x1="140"
      y1="55"
      x2="372"
      y2="450"
    >
      <stop offset="0" stop-color="#4dabf7" />
      <stop offset="1" stop-color="#cc5de8" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#4dabf7" stop-opacity="0.28" />
      <stop offset="1" stop-color="#4dabf7" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#ground)" />
  <rect width="512" height="512" fill="url(#glow)" />
  <g
    transform="translate(0 10)"
    fill="none"
    stroke="url(#glyph)"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M156 160a100 100 0 0 1 200 0" stroke-width="30" />
    <path d="M198 160a58 58 0 0 1 116 0" stroke-width="27" />
    <path d="M256 210v114" stroke-width="44" />
    <path d="M188 316 256 392 324 316Z" fill="url(#glyph)" stroke-width="16" />
    <path d="M190 418h132" stroke-width="28" />
  </g>
</svg>
