# One container with the UI, the API and the scheduler (RELEASARR_MODE=all, the
# default) on SQLite. compose.split.example.yaml runs the web side and the
# scheduler apart, on Postgres.
#
# Copy to compose.yaml, `docker compose up -d` and open http://<host>:8050 to
# create the first admin account. Sonarr, Radarr, Prowlarr, qBittorrent and the
# metadata keys can all be filled in under Settings from there, as any URL this
# container can reach: another host, a NAS, or a container on this one.
#
# Releasarr never opens a media file itself: it hands Sonarr and Radarr the
# paths qBittorrent reports, so it needs no download or library mounts. What it
# does need is for those paths to mean the same thing to qBittorrent and to
# Sonarr/Radarr, wherever each of them runs.

services:
  releasarr:
    # Pin a version rather than latest, so a restart never changes the version
    # underneath you. Swap for the build block below to run from a checkout.
    image: ghcr.io/zxibizz/releasarr:0.10.0
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: releasarr
    restart: unless-stopped
    environment:
      # s6 starts as root and drops to these before running anything; they own
      # everything under /config.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # For the log timestamps; the UI shows your browser's time zone anyway.
      TZ: ${TZ:-Etc/UTC}
      # Anything below this line can also be managed from the Settings page.
      # Setting it here pins it: the UI shows it read-only, marked "Set by
      # environment", so this file stays the source of truth for what it declares.
      # localhost here is this container, not the machine it runs on.
      # RELEASARR_SONARR_URL: http://<sonarr-host>:8989/api/v3
      # RELEASARR_SONARR_API_KEY: ${SONARR_API_KEY:-}
      # RELEASARR_RADARR_URL: http://<radarr-host>:7878/api/v3
      # RELEASARR_RADARR_API_KEY: ${RADARR_API_KEY:-}
      # RELEASARR_PROWLARR_URL: http://<prowlarr-host>:9696/api/v1
      # RELEASARR_PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      # RELEASARR_QBITTORRENT_URL: http://<qbittorrent-host>:8080/api/v2
      # RELEASARR_QBITTORRENT_USERNAME: admin
      # RELEASARR_QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
      #
      # Only behind a TLS reverse proxy. Over plain HTTP the browser drops a
      # Secure cookie and every sign-in is forgotten on the next page load.
      # RELEASARR_AUTH_COOKIE_SECURE: "true"
    volumes:
      # The SQLite database, the logs and the generated auth secret. Migrated on
      # every start; drop this and every restart begins from an empty instance.
      - ./releasarr-config:/config
    ports:
      # nginx serves the UI and proxies /api to the backend behind it.
      - "8050:8050"
