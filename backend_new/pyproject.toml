[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "releasarr-backend-new"
version = "0.1.0"
description = "Next-generation Releasarr backend aligned with the new frontend contract"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Releasarr Team" }]
dependencies = [
    "fastapi>=0.115.8",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.0",
    "sqlalchemy[asyncio]>=2.0.38",
    "alembic>=1.14.1",
    "httpx>=0.28.1",
    "asyncpg>=0.30.0",
    "python-json-logger>=2.0.7",
    "aiosqlite>=0.21.0",
    "loguru>=0.7.3",
]

[dependency-groups]
test = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]
typecheck = [
    "mypy>=1.13.0",
    "sqlalchemy2-stubs>=0.0.2a38",
]
lint = [
    "ruff>=0.9.7",
]
format = [
    "black>=24.10.0",
]

dev = [
    "ipython>=8.28.0",
]

[tool.uv]
default-groups = ["lint", "typecheck", "test"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
dynamic = []

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
implicit_reexport = false
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ASYNC", "PIE", "RUF"]

[tool.black]
line-length = 100
preview = true
